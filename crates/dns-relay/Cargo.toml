[package]
name = "rings-dns-relay"
description = "DNS relay for Rings: names every node <did>.<zone> and relays its services to the internet."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
hickory-server = { version = "0.26.3", default-features = false }
# The secret address key `k` (#852, #1122): with `zeroize`, sha2's block cores wipe their state on
# drop, so every `Hmac` instance's `k ⊕ ipad` and `k ⊕ opad` chaining values are wiped with it.
hmac = { version = "0.13.0", features = ["zeroize"] }
ipnet = { version = "2.11.0", features = ["serde"] }
ppp = "2.3.0"
rand = { version = "0.8.5", features = ["getrandom"] }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", features = ["zeroize"] }
socket2 = "0.6.5"
thiserror = "1"
tokio = { version = "1.13.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.37"
zeroize = { workspace = true }

[dev-dependencies]
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
tempfile = "3"
tokio = { version = "1.13.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
