[package]
name = "rings-gateway"
description = "Native packet gateway runtime for Rings onion TCP streams."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
ipnet = { version = "2.11.0", features = ["serde"] }
serde = { version = "1.0.136", features = ["derive"] }
smoltcp = { version = "0.14.0", default-features = false, features = [
    "std",
    "medium-ip",
    "proto-ipv4",
    "socket-tcp",
    "async",
] }
thiserror = "1"
tokio = { version = "1.13.0", features = ["io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.31.3", features = ["fs", "socket", "uio", "user"] }
route_manager = "0.2.13"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
serde_json = "1"
tun-rs = { version = "2.8.8", features = ["async_tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "gateway-config-unix"
path = "bin/gateway-config-unix.rs"
required-features = []
