[package]
name = "rings-turn"
default-run = "rings-turn"
description = "Signature-authenticated TURN server for Rings Network using Delegation credentials"
readme = "README.md"
keywords = ["turn", "webrtc", "p2p", "delegation", "rings"]
categories = ["network-programming", "cryptography"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "rings-turn"
path = "bin/rings-turn.rs"
required-features = ["cli"]

[lints]
workspace = true

[features]
default = ["server", "cli"]
# Lightweight TURN credential signing and verification without TURN/STUN server dependencies.
credentials = []
# Full native RFC 5766 TURN server runtime.
server = [
    "dep:async-trait",
    "dep:rand",
    "dep:rings-transport",
    "dep:stun",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:turn",
    "dep:webrtc-util",
]
cli = ["server", "dep:clap", "dep:tracing-subscriber"]

[dependencies]
base58-monero = { version = "0.3", default-features = false, features = ["check"] }
hex = "0.4.3"
rings-codec = { workspace = true }
rings-core = { workspace = true }
rings-network-policy = { workspace = true }
serde = { version = "1.0.136", features = ["derive"] }
thiserror = { version = "1", optional = true }
zeroize = { workspace = true }

[target.'cfg(target_family = "wasm")'.dependencies]
rings-core = { workspace = true, features = ["wasm"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-trait = { workspace = true, optional = true }
clap = { version = "4.0.14", features = ["derive", "env"], optional = true }
rand = { version = "0.8.5", optional = true }
rings-core = { workspace = true, features = ["default"] }
rings-transport = { workspace = true, default-features = false, features = ["turn-tcp-io"], optional = true }
stun = { version = "0.17.1", optional = true }
tokio = { version = "1.32.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tracing = { version = "0.1.37", optional = true }
tracing-subscriber = { version = "0.3.15", features = ["ansi", "env-filter"], optional = true }
turn = { version = "0.17.1", optional = true }
webrtc-util = { version = "0.17.1", optional = true }
