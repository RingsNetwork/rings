[package]
name = "rings-rpc"
description = """
Rings is a structured peer-to-peer network implementation using WebRTC, Chord algorithm, and full WebAssembly (WASM) support.
"""
readme = "README.md"
keywords = ["Chord", "DHT", "Web3", "P2P", "WASM"]
categories = ["network-programming", "cryptography", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["std"]
std = ["rings-core/default", "dep:reqwest", "reqwest/json", "reqwest/rustls-tls"]
wasm = ["rings-core/wasm", "dep:reqwest", "reqwest/json"]

[dependencies]
async-trait = { workspace = true }
base64 = { version = "0.13.0" }
bytes = "1.5.0"
jsonrpc-core = { workspace = true }
reqwest = { version = "0.12.22", optional = true, default-features = false }
rings-core = { workspace = true, optional = true }
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.70"
thiserror = "1"

# URL host parsing is shared by the native and browser credential policy.
[dependencies.url]
version = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { version = "0.3", features = ["Request", "RequestInit", "RequestRedirect", "Response", "Headers"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = { workspace = true }
