[package]
name = "rings-proofs"
description = "Proof system adapters for Rings Network guest extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
risc0-proof = [
    "dep:risc0-zkvm",
    "risc0-zkvm/disable-dev-mode",
    "dep:rmp-serde",
]
risc0-prove = [
    "risc0-proof",
    "risc0-zkvm/client",
    "risc0-zkvm/prove",
]
wasm-proof = [
    "dep:ark-bn254",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:num-bigint",
    "dep:tiny-keccak",
]

[dependencies]
ark-bn254 = { version = "0.4.0", default-features = false, features = ["curve"], optional = true }
ark-ec = { version = "0.4.2", default-features = false, optional = true }
ark-ff = { version = "0.4.2", default-features = false, optional = true }
bincode = "1.3.3"
bytes = { version = "1.2.1", features = ["serde"] }
num-bigint = { version = "0.4.3", optional = true }
risc0-zkvm = { version = "=3.0.5", default-features = false, optional = true }
rmp-serde = { version = "1.3.1", optional = true }
serde = { version = "1.0.136", features = ["derive"] }
thiserror = "1"
tiny-keccak = { version = "2.0.1", features = ["keccak"], optional = true }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
