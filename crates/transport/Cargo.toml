[package]
name = "rings-transport"
description = "Transport layer implementation for Rings Core"
readme = "README.md"
keywords = ["webrtc", "p2p", "wasm"]
categories = ["network-programming", "cryptography", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Include nothing by default
# The crate root rejects native+wasm backend combinations.
default = ["tokio/rt", "tokio/time", "tokio-util", "rings-runtime/tokio"]
dummy = ["webrtc", "dep:webrtc-sctp", "rand", "lazy_static", "tokio/rt", "tokio/sync", "tokio/time", "rings-runtime/tokio"]
native-webrtc = ["webrtc", "dep:webrtc-sctp", "tokio-util", "tokio/macros", "tokio/rt", "tokio/sync", "tokio/time", "rings-runtime/tokio"]
web-sys-webrtc = ["dep:futures-util", "dep:futures-channel", "wasm-bindgen", "js-sys", "web-sys", "wasm-bindgen-futures", "rings-runtime/browser"]

[dependencies]
# Dependencies for native-webrtc feature
tokio = { version = "1.32.0", optional = true }
tokio-util = { version = "0.7.8", optional = true }
webrtc = { workspace = true, optional = true }
# The SCTP crate `webrtc` 0.17.1 builds against, pinned: webrtc-sctp 0.17.2 added a field to
# `association::Config` that `webrtc` 0.17.1 does not set, so a published rings-transport would
# resolve 0.17.2 and fail to compile. In the workspace, `[patch.crates-io]` still replaces it
# with `vendor/webrtc-sctp`, which is 0.17.1 too. Drop the pin with the patch, at #1071.
webrtc-sctp = { version = "=0.17.1", optional = true }

# Dependencies for dummy feature
lazy_static = { version = "1.4.0", optional = true }
rand = { version = "0.8.5", optional = true, features = ["getrandom"] }

# Dependencies for web-sys-webrtc feature
futures-channel = { version = "0.3.31", optional = true }
futures-util = { version = "0.3.31", optional = true, default-features = false, features = ["std"] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { version = "0.3.64", optional = true, features = [
    "MessageEvent",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceCredentialType",
    "RtcIceGatheringState",
    "RtcIceServer",
    "RtcPeerConnection",
    "RtcPeerConnectionState",
    "RtcSdpType",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
] }

# Common dependencies
async-trait = { workspace = true }
bytes = { version = "1.4.0", features = ["serde"] }
chrono = { version = "0.4.30", features = ["wasmbind"] }
dashmap = "5.5.1"
rings-codec = { workspace = true }
rings-runtime = { workspace = true }
serde = "1.0.183"
serde_json = "1.0.106"
thiserror = "1.0.47"
tracing = "0.1.37"
url = { version = "2.4.0", features = ["serde"] }

[dev-dependencies]
futures = "0.3.28"
rings-test-support = { workspace = true }
wasm-bindgen-test = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
stateright = "0.31.0"
tokio = { version = "1.32.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
