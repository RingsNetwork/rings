# These are cooldown-gate exceptions, not build pins. Each fresh release is
# admitted early because it carries a security fix that every older
# compatible release lacks.

# RUSTSEC-2026-0346, -0347, -0348 and -0349 (#956).
[[allow.exact]]
crate = "rustls"
version = "0.23.46"

# RUSTSEC-2026-0382: distrusted intermediates may be accepted (#997).
[[allow.exact]]
crate = "rustls-webpki"
version = "0.103.16"

# RUSTSEC-2026-0381: bundled roots trust distrusted emSign intermediates (#997).
[[allow.exact]]
crate = "webpki-roots"
version = "1.0.10"

# RUSTSEC-2026-0387: the only constant-time fix for crypto-bigint (#1051).
[[allow.exact]]
crate = "crypto-bigint"
version = "0.7.6"

# RUSTSEC-2026-0387: the hardened constant-time primitives crypto-bigint 0.7.6 requires (#1051).
[[allow.exact]]
crate = "ctutils"
version = "0.4.5"
