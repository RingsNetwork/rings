[files]
extend-exclude = [
    "crates/gateway/vendor/netlink-packet-core/**",
    # Hex known-answer vectors and the CAESAR `crypto_aead` prototypes they are generated through.
    "crates/aez/vectors/reference.txt",
    "crates/aez/vectors/crypto_aead.h",
]

[type.rust]
extend-ignore-re = ["[wW]s", "WS"]

# Proper names in bibliography entries (papers/*.bib).
[default.extend-words]
Brin = "Brin"
Pease = "Pease"

# JSON-RPC method name as documented in docs/src/jsonrpc.md.
[default.extend-identifiers]
listPendings = "listPendings"
# Rust compression crate referenced by name in the changelog.
flate2 = "flate2"

# mdBook's own variable name, which docs/theme/rings.css must spell the same way to override it.
[type.css]
extend-ignore-re = ["--sidebar-non-existant"]
