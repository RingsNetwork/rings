[files]
extend-exclude = ["crates/gateway/vendor/netlink-packet-core/**"]

[type.rust]
extend-ignore-re = ["[wW]s", "WS"]

# Proper names in bibliography entries (papers/*.bib).
[default.extend-words]
Brin = "Brin"
Pease = "Pease"
Tung = "Tung"

# JSON-RPC method name as documented in docs/src/jsonrpc.md.
[default.extend-identifiers]
listPendings = "listPendings"
# Rust compression crate referenced by name in the changelog.
flate2 = "flate2"
# Single-use reply blocks (Mixminion, Sphinx), plural as used in papers/onion-kleisli-pipeline.tex.
SURBs = "SURBs"

# mdBook's own variable name, which docs/theme/rings.css must spell the same way to override it.
[type.css]
extend-ignore-re = ["--sidebar-non-existant"]

# amsmath's display environment name in papers/*.tex.
[type.tex]
extend-ignore-re = ["\\\\(begin|end)\\{multline\\*?\\}"]
