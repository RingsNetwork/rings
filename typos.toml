[files]
extend-exclude = [
    "crates/gateway/vendor/netlink-packet-core/**",
    # Hex known-answer vectors and the CAESAR `crypto_aead` prototypes they are generated through.
    "crates/aez/vectors/reference.txt",
    "crates/aez/vectors/crypto_aead.h",
]

[type.rust]
extend-ignore-re = ["[wW]s", "WS"]

# Proper names in bibliography entries (papers/*.bib).
[default.extend-words]
Brin = "Brin"
Pease = "Pease"
Ratatui = "Ratatui"
Tung = "Tung"
# SMTP's HELO command (RFC 5321 §4.1.1.1), and the names that spell it.
HELO = "HELO"
Helo = "Helo"
helo = "helo"

# Single-use reply blocks (Mixminion, Sphinx), plural as used in papers/rings.tex.
[default.extend-identifiers]
SURBs = "SURBs"
# Retransmission timeout field name on `turn::client::ClientConfig`.
rto_in_ms = "rto_in_ms"

# mdBook's own variable name, which docs/theme/rings.css must spell the same way to override it.
[type.css]
extend-ignore-re = ["--sidebar-non-existant"]

# amsmath's display environment name in papers/*.tex.
[type.tex]
extend-ignore-re = ["\\\\(begin|end)\\{multline\\*?\\}"]
