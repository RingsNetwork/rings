[files]
extend-exclude = ["crates/gateway/vendor/netlink-packet-core/**"]

[type.rust]
extend-ignore-re = ["[wW]s", "WS"]

# Proper names in bibliography entries (papers/*.bib).
[default.extend-words]
Brin = "Brin"
Pease = "Pease"

# JSON-RPC method name as documented in docs/src/jsonrpc.md.
[default.extend-identifiers]
listPendings = "listPendings"

# mdBook's own variable name, which docs/theme/rings.css must spell the same way to override it.
[type.css]
extend-ignore-re = ["--sidebar-non-existant"]
