[graph]
all-features = true

[advisories]
git-fetch-with-cli = false
ignore = [
    # crypto-bigint 0.5.5 has secret-dependent branches in operations meant to be constant-time.
    # The only fix is 0.7.6, and no 0.5.x release fixes it. 0.5.5 reaches us only through
    # elliptic-curve 0.13 (k256 0.13 in rings-core; p256 0.13 via webrtc's dtls), so leaving it
    # needs elliptic-curve 0.14 there and upstream. Tracked, and removed once fixed, in #1051.
    { id = "RUSTSEC-2026-0387", reason = "no crypto-bigint 0.5.x fix; elliptic-curve 0.14 upgrade tracked in #1051" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Version-less path dependencies are allowed only where they never reach a registry: a
# dev-dependency (cargo strips it when packaging) or a dependency of an unpublished crate. The
# test-support crate is such a dependency; a version on it would be packaged into rings-core's
# and rings-node's manifests and fail to resolve, since it is `publish = false`.
allow-wildcard-paths = true
highlight = "all"
allow-workspace = true
deny = [
    { name = "arrayref", version = "=0.3.10" },
    { name = "append-only-vec", version = "=0.1.9" },
    { name = "internment", version = "=0.8.7" },
    { name = "proc-macro1" },
    { name = "proc-macro-en" },
    { name = "aovine" },
    { name = "arone" },
    { name = "aronenao" },
    { name = "tinymember" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/matter-labs/zksync-crypto",
]
