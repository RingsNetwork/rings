[graph]
all-features = true

[advisories]
git-fetch-with-cli = false
ignore = [
    # Reviewed exceptions must use the structured form below and include a
    # follow-up issue plus an expiry date.
    { id = "RUSTSEC-2021-0141", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2024-0384", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2024-0388", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2024-0436", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2025-0057", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2025-0141", reason = "baseline migration tracked in #682 until 2026-10-31" },
    { id = "RUSTSEC-2025-0161", reason = "baseline migration tracked in #682 until 2026-10-31" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/matter-labs/zksync-crypto",
]
