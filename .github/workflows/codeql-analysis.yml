name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  schedule:
    - cron: "30 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze_static:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze_rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The generated/default CodeQL setup inferred C/C++ from crates/node/include/rings.h,
      # then failed because the repository has no C/C++ source files to extract. Keep the
      # checked-in configuration scoped to languages that have analyzable source here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"
