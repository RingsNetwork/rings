name: Release Build

# Reusable build matrix shared by `Auto Release` and `QACI`, so the PR path builds the exact same
# release targets and a release-only build failure (static-musl C++ linking, or the browser
# `wasm-pack`/`tsc`/`npm pack` path) can't pass PR CI and then break Auto Release.
#
# Separation of concerns — every release target is *built* on both paths; only versioned artifact
# naming + upload are release-only (gated by `publish_artifacts`):
#   - Native targets: `cargo build` always runs; the `zip` rename + upload are gated.
#   - Browser target: `npm pack` always runs (it triggers the root `prepare`:
#     `wasm-pack`/`dist`/`tsc`); only the versioned `mv` rename + upload are gated.
# So PR CI builds everything but never versions or uploads release artifacts; versioning and the
# GitHub Release itself live entirely in `auto-release.yml`.
on:
  workflow_call:
    inputs:
      version:
        description: Version string for naming packaged artifacts (release only).
        required: false
        type: string
        default: ci
      publish_artifacts:
        description: Version-name and upload the built binaries as release artifacts (release only).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.97.0
  WASM_BINDGEN_CLI_VERSION: 0.2.121
  WASM_PACK_VERSION: 0.15.0
  NODE_VERSION: 20.20.2

jobs:
  build_macos:
    name: build macos version binary
    timeout-minutes: 60
    runs-on: macos-latest
    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Get target
        id: target
        run: echo 'target=${{ matrix.arch }}-apple-darwin' >> "$GITHUB_OUTPUT"

      - name: Add target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add ${{ steps.target.outputs.target }} --toolchain "$RUST_TOOLCHAIN"

      - name: Setup rust toolchain
        run: |
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.target.outputs.target }}

      - name: Build
        run: |
          rustup run "$RUST_TOOLCHAIN" cargo build -p rings-node --bin rings --features node --no-default-features --release --target ${{ steps.target.outputs.target }}

      - name: Package
        if: ${{ inputs.publish_artifacts }}
        run: |
          zip -j rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.zip ./target/${{ steps.target.outputs.target }}/release/rings

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.publish_artifacts }}
        name: Upload artifacts
        with:
          name: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}
          path: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.zip
          retention-days: 1

  build_linux:
    name: build linux version binary
    timeout-minutes: 60
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        arch:
          - x86_64
        platform:
          - musl
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Get target
        id: target
        run: echo 'target=${{ matrix.arch }}-unknown-linux-${{ matrix.platform }}' >> "$GITHUB_OUTPUT"

      - name: Add target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add ${{ steps.target.outputs.target }} --toolchain "$RUST_TOOLCHAIN"

      - name: alias compiler
        run: |
          sudo ln -s /bin/g++ /bin/musl-g++

      - name: Setup rust toolchain
        run: |
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.target.outputs.target }}

      - name: Install musl-tools
        if: matrix.platform == 'musl'
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: |
          rustup run "$RUST_TOOLCHAIN" cargo build -p rings-node --bin rings --features node --no-default-features --release --target ${{ steps.target.outputs.target }}

      - name: Package
        if: ${{ inputs.publish_artifacts }}
        run: |
          zip -j rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.zip ./target/${{ steps.target.outputs.target }}/release/rings

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.publish_artifacts }}
        name: Upload artifacts
        with:
          name: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}
          path: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.zip
          retention-days: 1

  # `npm pack` runs the root `prepare` script (`wasm-pack build … --features browser_default`,
  # `dist` assembly, `tsc`) — a real release build path that QACI's cargo-wasm jobs do NOT
  # exercise. So build it on PRs too; only the versioned rename + upload are release-only.
  build_browser:
    name: build browser version binary
    timeout-minutes: 60
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        arch:
          - wasm32
        platform:
          - unknown
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: Get target
        id: target
        run: echo 'target=${{ matrix.arch }}-unknown-${{ matrix.platform }}' >> "$GITHUB_OUTPUT"

      - name: Add target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add ${{ steps.target.outputs.target }} --toolchain "$RUST_TOOLCHAIN"
          rustup default "$RUST_TOOLCHAIN"

      - uses: jetli/wasm-bindgen-action@20b33e20595891ab1a0ed73145d8a21fc96e7c29 # v0.2.0
        with:
          version: ${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Setup rust toolchain
        run: |
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ steps.target.outputs.target }}

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: |
          npm ci --ignore-scripts
          npm pack

      - name: Package
        if: ${{ inputs.publish_artifacts }}
        run: |
          mv ringsnetwork-rings-node-*.tgz rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.publish_artifacts }}
        name: Upload artifacts
        with:
          name: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}
          path: rings-${{ inputs.version }}-${{ steps.target.outputs.target }}.tgz
          retention-days: 1
