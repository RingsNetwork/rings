name: QACI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0
  NIGHTLY_TOOLCHAIN: nightly-2026-07-02
  WASM_BINDGEN_TEST_TIMEOUT: 120
  WASM_BINDGEN_CLI_VERSION: 0.2.121
  WASM_PACK_VERSION: 0.15.0
  NODE_VERSION: 20.20.2
  PYTHON_VERSION: "3.11"
  CARGO_DENY_VERSION: 0.20.2
  TRUNK_VERSION: 0.21.14
  TAPLO_CLI_VERSION: 0.10.0

permissions:
  contents: read

# Cancel superseded in-flight runs for the same PR (a new push obsoletes the previous
# run). Scoped by head ref so parallel PRs don't cancel each other; master pushes use the
# commit ref and are never cancelled, keeping the default-branch history intact.
concurrency:
  group: qaci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build every release target (macOS, static-musl linux, browser) on each PR via the shared
  # reusable workflow, so a release-only build failure (static-musl C++ linking, or the browser
  # `wasm-pack`/`tsc`/`npm pack` path) can't pass PR CI and then break Auto Release. With
  # `publish_artifacts` left false the PR builds all targets but does not version or upload
  # release artifacts (only the versioned rename + upload are release-only; that, and the
  # GitHub Release, live in auto-release.yml).
  # PR-only: on master pushes Auto Release already builds these targets, so don't double-build.
  # No `secrets: inherit` — the reusable workflow uses the automatic `github.token`.
  build_release_targets:
    name: Build release targets
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/release-build.yml

  dependency_policy:
    name: Dependency policy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup show

      - name: Cargo cooldown check
        uses: RyanKung/cargo-cooldown-check@d8588ee951cc30c7680e7538f20cfe190eaa1350

      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Check dependency policy
        run: cargo deny --locked check -A unmatched-source advisories licenses bans sources

  miri_core:
    name: Miri core invariants
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup Miri toolchain
        run: |
          rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
          rustup component add miri rust-src --toolchain "$NIGHTLY_TOOLCHAIN"
          cargo +"$NIGHTLY_TOOLCHAIN" miri setup
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run Miri-compatible core tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          set -euo pipefail
          for filter in \
            "lifecycle::tests" \
            "dht::did::tests" \
            "dht::virtual_node::tests"
          do
            cargo +"$NIGHTLY_TOOLCHAIN" miri test -q -p rings-core --lib "$filter"
          done

  ffi_sanitizers:
    name: FFI ASan and LSan
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      LSAN_OPTIONS: print_suppressions=0
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Zsanitizer=address
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup sanitizer toolchain
        run: |
          rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
          rustup default "$NIGHTLY_TOOLCHAIN"
          rustup target add x86_64-unknown-linux-gnu --toolchain "$NIGHTLY_TOOLCHAIN"
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run FFI lifecycle tests under ASan and LSan
        run: |
          set -euo pipefail
          set +e
          output="$(cargo +"$NIGHTLY_TOOLCHAIN" test --target x86_64-unknown-linux-gnu -p rings-node --features ffi ffi_ -- --nocapture 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<< "$output"

  build_wasm:
    name: Build and test for wasm
    timeout-minutes: 45
    strategy:
      matrix:
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add wasm32-unknown-unknown
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: jetli/wasm-bindgen-action@20b33e20595891ab1a0ed73145d8a21fc96e7c29 # v0.2.0
        with:
          version: ${{ env.WASM_BINDGEN_CLI_VERSION }}

      - name: Run clippy for core wasm
        run: cargo clippy -p rings-core --features wasm --no-deps --no-default-features --target=wasm32-unknown-unknown --tests -- -D warnings

      - name: Run clippy for transport wasm
        run: cargo clippy -p rings-transport --features web-sys-webrtc --no-deps --no-default-features --target=wasm32-unknown-unknown --tests -- -D warnings

      - name: Run strict clippy for node browser lib
        run: |
          cargo clippy -p rings-node --features browser --no-deps --no-default-features --target=wasm32-unknown-unknown --lib -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::indexing_slicing

      - name: Verify native gateway dependencies are absent from browser builds
        run: |
          set -euo pipefail
          if cargo tree -p rings-node --target wasm32-unknown-unknown --no-default-features --features browser -e features \
            | grep -E 'rings-gateway|route_manager|tun-rs'
          then
            echo "native gateway dependency leaked into the WASM browser graph" >&2
            exit 1
          fi

      - name: Run clippy for node browser
        run: cargo clippy -p rings-node --features browser_default --no-deps --no-default-features --target=wasm32-unknown-unknown --tests -- -D warnings

      - name: Install wasm-pack
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend extension script dependencies
        run: npm ci --ignore-scripts

      - name: Install frontend Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Check frontend extension scripts
        run: npm run build:frontend-extension-scripts

      - name: Install extension icon renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Install Trunk
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: trunk@${{ env.TRUNK_VERSION }}

      - name: Build Rings frontend extension package
        run: npm run package:frontend-extension

      - name: Test Rings extension Onion WebView
        run: |
          xvfb-run -a node frontend/.generated/scripts/test-extension-webview.mjs
          xvfb-run -a node frontend/.generated/scripts/test-extension-webview-regressions.mjs

      - name: Check Rings frontend
        run: cargo check --target=wasm32-unknown-unknown
        working-directory: ./frontend

      - name: Run clippy for Rings frontend
        run: cargo clippy --target=wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: ./frontend

      - name: Run Rings frontend tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo test --release --target=wasm32-unknown-unknown
          working-directory: ./frontend

      - name: Run dweb example browser tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: |
            wasm-pack test --release --headless --chrome . -- --skip two_nodes_fetch_a_hosted_page
            wasm-pack test --release --headless --chrome . -- two_nodes_fetch_a_hosted_page --nocapture
          working-directory: ./examples/dweb

      - name: Run core browser tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo test -p rings-core --release --target=wasm32-unknown-unknown --features wasm --no-default-features
          working-directory: ./

      - name: Run transport browser tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo test -p rings-transport --release --target=wasm32-unknown-unknown --features web-sys-webrtc --no-default-features
          working-directory: ./

      - name: Run node browser tests
        uses: coactions/setup-xvfb@b6b4fcfb9f5a895edadc3bc76318fae0ac17c8b3 # v1
        with:
          run: cargo test -p rings-node --release --target=wasm32-unknown-unknown --features browser_default --no-default-features
          working-directory: ./

  build:
    name: Build and test
    timeout-minutes: 45
    strategy:
      matrix:
        os: ["ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --all --verbose

      - name: Run doc tests
        run: cargo test --doc

      - name: Run dummy tests
        run: cargo test -p rings-core --features dummy --verbose

      - name: Run transport dummy tests
        run: cargo test -p rings-transport --no-default-features --features dummy --verbose

      - name: Run tests
        run: cargo test --release --all --all-targets --verbose

      - name: Exercise captured TCP through a two-hop Onion public exit
        run: |
          cargo test --release -p rings-node \
            processor::tests::test_gateway::captured_tcp_reaches_public_http_only_through_two_hop_onion_route \
            -- --ignored --exact --nocapture

      - name: Exercise privileged Linux TUN and route cleanup
        run: |
          set -euo pipefail
          gateway_test="$(
            cargo test --release -p rings-gateway --test native_gateway --no-run --message-format=json |
              python3 scripts/find-cargo-test-binary.py native_gateway
          )"
          test -n "$gateway_test"
          sudo "$gateway_test" \
            privileged_native_tunnel_establishes_and_cleans_up \
            --ignored --exact --nocapture

      - name: Exercise privileged Linux helper, fd retention, and disconnect recovery
        run: |
          set -euo pipefail
          helper_test="$(
            cargo test --release -p rings-gateway --test unix_helper --no-run --message-format=json |
              python3 scripts/find-cargo-test-binary.py unix_helper
          )"
          test -n "$helper_test"
          sudo "$helper_test" \
            privileged_helper_retains_and_recovers_a_disconnected_lease \
            --ignored --exact --nocapture

      - name: Exercise kernel TCP through Linux TUN and two-hop Onion exit
        run: |
          set -euo pipefail
          node_test="$(
            cargo test --release -p rings-node --lib --no-run --message-format=json |
              python3 scripts/find-cargo-test-binary.py rings_node
          )"
          test -n "$node_test"
          sudo "$node_test" \
            processor::tests::test_gateway::real_linux_tun_tcp_reaches_public_http_through_two_hop_onion_route \
            --ignored --exact --nocapture

  build_ffi:
    name: Build and test for examples
    timeout-minutes: 20
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run clippy for node ffi
        run: cargo clippy -p rings-node --features ffi

      - name: Build
        run: cargo build -p rings-node --features ffi

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python FFI test dependencies
        run: python -m pip install --upgrade pip wheel && python -m pip install web3 cffi pytest

      - name: Run FFI Python integration tests
        env:
          RINGS_FFI_REQUIRE_LIBRARY: "1"
        run: pytest examples/ffi/tests

      - name: Run Swift FFI desktop smoke test
        if: runner.os == 'macOS'
        env:
          RINGS_FFI_REQUIRE_LIBRARY: "1"
        run: bash examples/ffi/swift/test.sh "$PWD/target/debug/librings_node.dylib"

      - name: Exercise privileged macOS utun and route cleanup
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          gateway_test="$(
            cargo test -p rings-gateway --test native_gateway --no-run --message-format=json |
              python3 scripts/find-cargo-test-binary.py native_gateway
          )"
          test -n "$gateway_test"
          sudo "$gateway_test" \
            privileged_native_tunnel_establishes_and_cleans_up \
            --ignored --exact --nocapture

          helper_test="$(
            cargo test -p rings-gateway --test unix_helper --no-run --message-format=json |
              python3 scripts/find-cargo-test-binary.py unix_helper
          )"
          test -n "$helper_test"
          sudo "$helper_test" \
            privileged_helper_retains_and_recovers_a_disconnected_lease \
            --ignored --exact --nocapture

      - name: Setup Java for Kotlin FFI example
        if: runner.os == 'Linux'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle for Kotlin FFI example
        if: runner.os == 'Linux'
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "7.6.4"

      - name: Run Kotlin/JNA FFI desktop smoke test
        if: runner.os == 'Linux'
        env:
          RINGS_FFI_LIBRARY: ${{ github.workspace }}/target/debug/librings_node.so
          RINGS_FFI_REQUIRE_LIBRARY: "1"
        run: gradle -p examples/ffi/kotlin test --no-daemon

      # - name: Smoke test native
      #   run: cargo run -p rings-native-example

  gateway_windows:
    name: Check Windows Wintun gateway
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check shared data plane and Wintun binding
        run: cargo check -p rings-gateway --all-targets

      - name: Check native node gateway integration
        run: cargo check -p rings-node --no-default-features --features node

      - name: Download the signed Wintun runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wintun-0.14.1.zip"
          $destination = Join-Path $env:RUNNER_TEMP "wintun-0.14.1"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expected = "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
          if ($actual -ne $expected) {
            throw "Wintun archive checksum mismatch: expected $expected, got $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $dll = Join-Path $destination "wintun\bin\amd64\wintun.dll"
          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
            throw "Wintun DLL was not found at $dll"
          }
          "RINGS_GATEWAY_WINTUN_DLL=$dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise Wintun and Windows route cleanup
        run: cargo test -p rings-gateway --test native_gateway privileged_native_tunnel_establishes_and_cleans_up -- --ignored --exact --nocapture

  rustfmt_and_clippy:
    name: Check rustfmt style && run clippy
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Check typos
        uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

      - name: Setup rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal
          rustup component add rustfmt --toolchain "$NIGHTLY_TOOLCHAIN"
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run strict clippy for node native lib
        run: |
          cargo clippy -p rings-node --no-default-features --features node --lib -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -D clippy::indexing_slicing

      - name: Check node native with browser feature enabled
        run: cargo check -p rings-node --all-features

      - name: Run clippy
        run: cargo clippy --all --tests -- -D warnings

      - name: Run clippy for transport without a runtime backend
        run: cargo clippy -p rings-transport --no-default-features --lib -- -D warnings

      - name: Check formating
        run: cargo +"$NIGHTLY_TOOLCHAIN" fmt --all -- --check

      - name: Check docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --all --no-deps

      - name: Check transport docs without a runtime backend
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc -p rings-transport --no-default-features --no-deps

      - name: Install taplo
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: taplo-cli@${{ env.TAPLO_CLI_VERSION }}

      - name: Check toml file formating by taplo
        run: taplo format --check
