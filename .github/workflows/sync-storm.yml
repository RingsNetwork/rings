name: Deterministic sync storm

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:

# This is the sole PR/master owner of the storm suite. Do not path-filter it:
# Cargo features, workspace dependencies, and helper changes can affect these tests.
concurrency:
  group: sync-storm-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.0

jobs:
  sync-storm-pr:
    name: Ring and hotspot deterministic replay
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      SYNC_STORM_TRACE_DIR: ${{ github.workspace }}/target/sync-storm-traces
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cache Rust dependencies and test artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compile storm executable once
        run: |
          mkdir -p target/ci-evidence
          cargo test --locked --profile ci -p rings-core --features dummy --no-default-features --no-run --timings --message-format=json > target/ci-evidence/storm.jsonl
      - name: Reject simulation system-time leaks
        run: bash scripts/check-sync-storm-time-leaks.sh
      - name: Run PR sync-storm gate
        run: >-
          python3 scripts/run-ci-tests.py target/ci-evidence/storm.jsonl
          --inventory target/ci-evidence/storm-inventory.json --nocapture
          --filter tests::default::test_sync_storm::
      - name: Run PR N=10/25/50 scale gate
        run: >-
          python3 scripts/run-ci-tests.py target/ci-evidence/storm.jsonl
          --inventory target/ci-evidence/scale-inventory.json
          --ignored --exact --nocapture
          --filter tests::default::test_sync_storm::cases::test_pr_ring_and_hotspot_size_matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        name: Upload PR sync-storm traces
        with:
          name: sync-storm-pr-traces-${{ github.run_id }}
          path: |
            target/sync-storm-traces/
            target/ci-evidence/
            target/cargo-timings/
          if-no-files-found: error

  sync-storm-nightly:
    name: Ring and hotspot N=10/25/50
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      SYNC_STORM_TRACE_DIR: ${{ github.workspace }}/target/sync-storm-traces
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Setup Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Cache Rust dependencies and test artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compile storm executable once
        run: |
          mkdir -p target/ci-evidence
          cargo test --locked --profile ci -p rings-core --features dummy --no-default-features --no-run --timings --message-format=json > target/ci-evidence/storm.jsonl
      - name: Reject simulation system-time leaks
        run: bash scripts/check-sync-storm-time-leaks.sh
      - name: Run nightly size and seed matrices
        run: |
          python3 scripts/run-ci-tests.py target/ci-evidence/storm.jsonl \
            --inventory target/ci-evidence/scale-inventory.json --ignored --exact --nocapture \
            --filter tests::default::test_sync_storm::cases::test_pr_ring_and_hotspot_size_matrix
          python3 scripts/run-ci-tests.py target/ci-evidence/storm.jsonl \
            --inventory target/ci-evidence/seeds-inventory.json --ignored --exact --nocapture \
            --filter tests::default::test_sync_storm::cases::test_nightly_extended_seed_matrix
      - name: Publish replay index
        if: always()
        run: |
          echo "## Sync-storm replay artifacts" >> "$GITHUB_STEP_SUMMARY"
          find "$SYNC_STORM_TRACE_DIR" -type f -name '*.json' -print 2>/dev/null \
            | sort >> "$GITHUB_STEP_SUMMARY" || true
          echo "Each test log contains a directly reusable SYNC_STORM_* replay command." \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        name: Upload sync-storm traces
        with:
          name: sync-storm-traces
          path: |
            target/sync-storm-traces/
            target/ci-evidence/
            target/cargo-timings/
          if-no-files-found: ignore
