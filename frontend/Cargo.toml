[package]
name = "rings-frontend"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
publish = false

# Wasm/Yew app for both web and Chrome MV3 extension packaging. The empty
# workspace avoids feature unification with native examples while this app uses
# browser node features plus application-level extensions.
[workspace]

[dependencies]
async-trait = "0.1"
base58 = "0.2"
base64 = "0.22"
futures = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "=0.3.98"
rings-node = { path = "../crates/node", default-features = false, features = ["browser"] }
rings-snark-extension = { path = "../extension/snark", default-features = false, features = ["browser"] }
rings-webview = { path = "../crates/webview", features = ["browser"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"
web-sys = { version = "=0.3.98", features = [
    "Event",
    "EventTarget",
    "History",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "Location",
    "SubmitEvent",
    "Url",
    "Window",
] }
yew = { version = "0.21", features = ["csr"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.71"

[lints.rust]
missing_docs = "deny"
warnings = "deny"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
