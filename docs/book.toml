# The Rings documentation book. Built by mdBook into the GitHub Pages site under `/docs/`
# (see `.github/workflows/deploy-pages.yml`); `mdbook serve docs` previews it locally.
[book]
title = "Rings Network"
description = "Documentation for Rings, a peer-to-peer network in browsers and native nodes"
authors = ["Rings Network"]
language = "en"
src = "src"

[build]
build-dir = "book"

# The theme is the built-in one with `theme/index.hbs` (the default template carrying the
# frontend's header and footer) and `theme/rings.css` (the frontend's palette, type, cards,
# and pills); `light` and `navy` are the two themes the stylesheet restyles, so they are the
# defaults for each colour scheme.
[output.html]
site-url = "/docs/"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/rings.css"]
git-repository-url = "https://github.com/RingsNetwork/rings"
edit-url-template = "https://github.com/RingsNetwork/rings/edit/master/docs/{path}"
