[package]
name = "rings-node-demo"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

# Standalone wasm/Yew app (build with Trunk). The empty workspace avoids
# feature unification with native examples while this app uses browser_default.
[workspace]

[dependencies]
base58 = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "=0.3.77"
rings-node = { path = "../../crates/node", default-features = false, features = ["browser_default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
web-sys = { version = "=0.3.77", features = [
  "Event",
  "EventTarget",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "InputEvent",
] }
yew = { version = "0.21", features = ["csr"] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.50"
