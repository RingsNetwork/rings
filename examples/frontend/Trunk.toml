[watch]
watch = [
  "index.html",
  "src",
  "assets",
  "Cargo.toml",
  "Trunk.toml",
  "extension-assets",
  "scripts/package-extension.mts",
  "tsconfig.base.json",
  "tsconfig.extension-assets.json",
  "tsconfig.scripts.json",
]
ignore = [
  "dist",
  "dist-extension",
]

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "npm --prefix ../.. run build:frontend-extension-scripts && node .generated/scripts/package-extension.mjs"]
