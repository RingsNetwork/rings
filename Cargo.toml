[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/native",
    "examples/relay",
]
exclude = [
    "crates/gateway/vendor/netlink-packet-core",
]

[workspace.package]
version = "0.20.1"
edition = "2021"
license = "GPL-3.0-only"
authors = ["RND <dev@ringsnetwork.io>"]
repository = "https://github.com/RingsNetwork/rings"

[workspace.dependencies]
async-trait = "0.1.77"
js-sys = "0.3.98"
jsonrpc-core = "18.0.0"
rings-codec = { path = "crates/codec", version = "0.20.1" }
rings-core = { path = "crates/core", version = "0.20.1", default-features = false }
rings-derive = { path = "crates/derive", version = "0.20.1", default-features = false }
rings-gateway = { path = "crates/gateway", version = "0.20.1" }
rings-measure = { path = "crates/measure", version = "0.20.1" }
rings-network-policy = { path = "crates/network-policy", version = "0.20.1" }
rings-node = { path = "crates/node", version = "0.20.1" }
rings-rpc = { path = "crates/rpc", version = "0.20.1", default-features = false }
rings-transport = { path = "crates/transport", version = "0.20.1" }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
wasm-bindgen-macro-support = "0.2.121"
wasm-bindgen-test = "0.3.71"
webrtc = { version = "0.17.1" }

[workspace.lints.rust]
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[patch.crates-io]
# Upstream 0.8.2 with only its macro dependency redirected to maintained `pastey`.
netlink-packet-core = { path = "crates/gateway/vendor/netlink-packet-core" }

[profile.release]
opt-level = 3
lto = true
strip = true
