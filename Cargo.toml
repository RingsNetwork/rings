[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/mailbox",
    "examples/native",
    "examples/relay",
]
exclude = [
    "crates/gateway/vendor/netlink-packet-core",
]

[workspace.package]
version = "0.37.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["RND <dev@rings.rs>"]
repository = "https://github.com/RingsNetwork/rings"

[workspace.dependencies]
async-trait = "0.1.77"
js-sys = "0.3.98"
jsonrpc-core = "18.0.0"
rings-aez = { path = "crates/aez", version = "0.37.0" }
rings-codec = { path = "crates/codec", version = "0.37.0" }
rings-core = { path = "crates/core", version = "0.37.0", default-features = false }
rings-derive = { path = "crates/derive", version = "0.37.0", default-features = false }
rings-dns-relay = { path = "crates/dns-relay", version = "0.37.0" }
rings-gateway = { path = "crates/gateway", version = "0.37.0" }
rings-measure = { path = "crates/measure", version = "0.37.0" }
rings-network-policy = { path = "crates/network-policy", version = "0.37.0" }
rings-node = { path = "crates/node", version = "0.37.0" }
rings-rpc = { path = "crates/rpc", version = "0.37.0", default-features = false }
rings-runtime = { path = "crates/runtime", version = "0.37.0", default-features = false }
rings-test-support = { path = "crates/test-support" }
rings-transport = { path = "crates/transport", version = "0.37.0" }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.121"
wasm-bindgen-futures = "0.4.71"
wasm-bindgen-macro-support = "0.2.121"
wasm-bindgen-test = "0.3.71"
webrtc = { version = "0.17.1" }
zeroize = "1.8.1"

[workspace.lints.rust]
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[patch.crates-io]
# Upstream 0.8.2 with only its macro dependency redirected to maintained `pastey`.
netlink-packet-core = { path = "crates/gateway/vendor/netlink-packet-core" }

# Dependencies build optimized in the dev and test profiles; workspace crates stay at
# `opt-level = 0`, so editing them recompiles as before. A law that signs or encrypts runs
# in k256, p256, ark-bls12-381 or curve25519-dalek; with them unoptimized, such tests ran
# 7–70× slower (#1002). The cost: a debugger steps through optimized dependency code.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
strip = true

# Optimized test harnesses without release packaging's expensive whole-program LTO.
# Inherit release assertion semantics so the rejoin model's exhaustive searches stay enabled.
# Shipping binaries and browser builds continue to use the unchanged release profile.
#
# Optimization follows where test time is spent (#1002). A workspace crate builds at
# `opt-level = 1`: codegen is about half of each large unit's compile, and these crates' tests
# spend their CPU in dependencies or wait on events. Three stay at `opt-level = 3`:
# dependencies, which are cached across runs and run every signature and hash; rings-core,
# whose own code runs the exhaustive model searches; and rings-aez, the onion cipher.
[profile.ci]
inherits = "release"
opt-level = 1
lto = false
strip = false
debug-assertions = false

[profile.ci.package."*"]
opt-level = 3

[profile.ci.package.rings-core]
opt-level = 3

[profile.ci.package.rings-aez]
opt-level = 3
